name: CI

on:
  push:
    paths-ignore: [ "**.md", "LICENSE", ".gitignore" ]
  pull_request:
    paths-ignore: [ "**.md", "LICENSE", ".gitignore" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v32
      - name: Module option -> flag check
        run: nix build .#checks.x86_64-linux.module-eval --print-build-logs
      - name: Flake check
        run: nix flake check --all-systems --print-build-logs
      - name: Formatting
        run: nix fmt -- --check flake.nix pkgs/package.nix modules/nixos.nix tests/module-eval.nix
